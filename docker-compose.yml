services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffxiv_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ffxiv
    depends_on:
      - database
      - redis

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffxiv_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ffxiv
    depends_on:
      - database
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffxiv_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ffxiv
    depends_on:
      - database
      - redis

  webserver:
    image: nginx:alpine
    container_name: ffxiv_webserver
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ffxiv
      - traefik-net
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ffxiv.rule=Host(`ffxiv.local`)"
      - "traefik.http.routers.ffxiv.entrypoints=web"
      - "traefik.http.routers.ffxiv.middlewares=ffxiv-https-redirect"
      - "traefik.http.middlewares.ffxiv-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.ffxiv-secure.rule=Host(`ffxiv.local`)"
      - "traefik.http.routers.ffxiv-secure.entrypoints=websecure"
      - "traefik.http.routers.ffxiv-secure.tls=true"
      - "traefik.http.services.ffxiv.loadbalancer.server.port=80"

  database:
    image: mysql:8.0
    container_name: ffxiv_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ffxiv_market
      MYSQL_USER: ffxiv
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ffxiv
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: ffxiv_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ffxiv
    ports:
      - "6379:6379"

networks:
  ffxiv:
    driver: bridge
  traefik-net:
    external: true

volumes:
  mysql_data:
    external: true
    name: www_mysql_data
  redis_data:
    external: true
    name: www_redis_data
