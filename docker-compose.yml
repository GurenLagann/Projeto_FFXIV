services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffxiv_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ffxiv
    depends_on:
      - database
      - redis
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffxiv_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ffxiv
    depends_on:
      - database
      - redis
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffxiv_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ffxiv
    depends_on:
      - database
      - redis
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  webserver:
    image: nginx:alpine
    container_name: ffxiv_webserver
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ffxiv
      - traefik-net
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ffxiv.rule=Host(`ffxiv.local`)"
      - "traefik.http.routers.ffxiv.entrypoints=web"
      - "traefik.http.routers.ffxiv.middlewares=ffxiv-https-redirect"
      - "traefik.http.middlewares.ffxiv-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.ffxiv-secure.rule=Host(`ffxiv.local`)"
      - "traefik.http.routers.ffxiv-secure.entrypoints=websecure"
      - "traefik.http.routers.ffxiv-secure.tls=true"
      - "traefik.http.services.ffxiv.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  database:
    image: mysql:8.0
    container_name: ffxiv_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ffxiv
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ffxiv_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ffxiv
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ffxiv:
    driver: bridge
  traefik-net:
    external: true

volumes:
  mysql_data:
    external: true
    name: www_mysql_data
  redis_data:
    external: true
    name: www_redis_data
