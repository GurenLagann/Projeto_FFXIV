services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffxiv_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ffxiv
    depends_on:
      - database
      - redis

  webserver:
    image: nginx:alpine
    container_name: ffxiv_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ffxiv
    depends_on:
      - app

  database:
    image: mysql:8.0
    container_name: ffxiv_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ffxiv_market
      MYSQL_USER: ffxiv
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ffxiv
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: ffxiv_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ffxiv
    ports:
      - "6379:6379"

networks:
  ffxiv:
    driver: bridge

volumes:
  mysql_data:
    external: true
    name: www_mysql_data
  redis_data:
    external: true
    name: www_redis_data
